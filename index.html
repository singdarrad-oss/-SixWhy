<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SixWhy</title>
<meta name="theme-color" content="#F2EFE8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="IMG_5479.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B312E;--mut:#6F7A72;--lilac:#7C9479;--lilac-deep:#5F7A5C;--lilac-soft:#DFE8DB;--lilac-line:#BCCBB6;--paper:#F2EFE8;--card:#FAF8F3;--line:#E2DCCE;--butter:#EAE0CC;--butter2:#F0E9DA;--butter-soft:#F4EEE1;--butter-line:#D6C9AC;--butter-ink:#6B5F45;--butter-mut:#8A7C5C;--serif:'Cormorant Garamond',serif;--sans:'Manrope',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:#E7E3D9}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;flex-direction:column;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
.scr.active{opacity:1;pointer-events:auto}
button{font-family:var(--sans)}
.wordmark{font-family:var(--serif);font-size:42px;font-weight:600;text-align:center;margin:20px 0 10px}
.wordmark em{font-style:italic;color:var(--lilac-deep)}
.auth-sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mut);text-align:center;margin-bottom:24px}
.field-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--card);outline:none}
input:focus,textarea:focus{border-color:var(--lilac)}
#pinInputReg,#pinInput{letter-spacing:8px;text-align:center;font-weight:800}
.field-hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.go-btn{width:100%;margin-top:14px;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer}
.go-btn.butter{background:var(--butter);color:var(--butter-ink)}
.go-btn.outline{background:transparent;color:var(--lilac-deep);border:1.5px solid var(--lilac-line)}
.priv-note{margin-top:20px;background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:13px;font-size:12.5px;line-height:1.5;color:var(--butter-ink)}
.disclaimer{margin-top:14px;font-size:11px;color:#a49e91;text-align:center}
.home-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.home-top .wm{font-family:var(--serif);font-size:23px;font-weight:600}
.home-top .wm em{font-style:italic;color:var(--lilac-deep)}
.ibtn{border:none;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.greet{font-family:var(--serif);font-style:italic;font-size:24px;margin-bottom:14px}
.greet b{color:var(--lilac-deep)}
.challenge{background:var(--lilac-soft);border:1px solid var(--lilac-line);border-radius:16px;padding:14px;margin-bottom:14px}
.challenge .ch-t{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--lilac-deep);font-weight:600}
.challenge .ch-d{font-size:11px;color:var(--butter-mut);font-weight:800}
.ch-dots{display:flex;gap:6px;margin:10px 0}
.ch-dot{flex:1;height:7px;border-radius:100px;background:#fff;border:1px solid var(--lilac-line)}
.ch-dot.on{background:var(--lilac);border-color:var(--lilac)}
.challenge .ch-msg{font-size:12px;color:var(--mut);line-height:1.5}
.youalone{text-align:center;font-size:12px;color:var(--mut);margin-bottom:12px}
.youalone b{color:var(--lilac-deep)}
.quote-card{border-radius:16px;padding:16px;margin-bottom:10px;position:relative}
.quote-card.lil{background:var(--lilac-soft);border:1px solid var(--lilac-line)}
.quote-card.but{background:var(--butter2);border:1px solid var(--butter-line)}
.qc-lbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:4px}
.quote-card.but .qc-lbl{color:var(--butter-mut)}
.qc-q{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4}
.qc-a{font-size:10px;font-weight:700;margin-top:4px;text-align:right;color:var(--mut)}
.tiles-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:15px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.tile .ti svg{width:24px;height:24px;fill:none;stroke:var(--lilac-deep);stroke-width:1.8}
.tile .tt{font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;margin-top:8px}
.tile .td{font-size:10px;color:var(--mut);margin-top:2px}
.tile.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.start-btn{width:100%;margin-top:16px;border:none;border-radius:16px;padding:17px;font-size:16px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer}
.home-foot{text-align:center;font-size:10px;color:#a49e91;margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.topbar .wm{font-family:var(--serif);font-size:21px;font-weight:600}
.topbar .wm em{font-style:italic;color:var(--lilac-deep)}
.inputbar{display:flex;gap:8px;padding:6px 0 10px}
#msgInput{flex:1;border:1.5px solid var(--line);border-radius:100px;padding:12px 18px;font-size:15px;background:var(--card)}
.send{width:44px;height:44px;border:none;border-radius:50%;background:var(--butter);display:grid;place-items:center;cursor:pointer}
.send svg{width:18px;height:18px;fill:none;stroke:var(--butter-ink);stroke-width:2.3}
.progress{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0}
.pdot{width:7px;height:7px;border-radius:50%;background:#DDD8CC}
.pdot.on{background:var(--lilac)}
.canvas{flex:1;overflow-y:auto;padding:10px 20px}
.hint-empty{text-align:center;padding:40px 20px}
.hint-empty .hd{font-family:var(--serif);font-style:italic;font-size:20px;color:#98a094;margin-bottom:8px}
.hint-empty p{font-size:13px;color:#a49e91;line-height:1.6}
.thread{border-left:1.5px solid var(--butter-line);padding:6px 0 10px 24px;margin-left:4px}
.entry{margin-bottom:20px;position:relative}
.entry::before{content:"";position:absolute;left:-29px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--butter-mut)}
.entry .who{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:4px}
.entry .txt{font-size:14px;line-height:1.5}
.entry.prompt .q{font-family:var(--serif);font-style:italic;font-weight:600;font-size:28px;color:var(--ink)}
.entry .num{font-size:10px;color:var(--lilac-line);margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
.thinking{display:flex;gap:5px;padding:10px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--butter-mut);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.4}50%{opacity:1}}
.draw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.draw-head h2{font-family:var(--serif);font-style:italic;font-size:24px}
.draw-sub{font-size:14px;color:var(--mut);font-style:italic;margin-bottom:10px}
.noise-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.noise-pill{border:1.5px solid var(--line);border-radius:100px;padding:6px 12px;background:var(--card);font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
.noise-pill.sel{background:var(--lilac);border-color:var(--lilac);color:#fff}
.method-row{display:flex;gap:8px;margin-bottom:10px}
.method{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);cursor:pointer}
.method.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.method .mt{font-family:var(--serif);font-style:italic;font-size:14px;font-weight:600}
.method .md{font-size:10px;color:var(--mut)}
.music-btn{width:100%;border:1.5px solid var(--butter-line);border-radius:100px;padding:9px;background:var(--butter2);color:var(--butter-ink);font-size:12px;font-weight:700;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.music-btn.on{background:var(--lilac-soft);border-color:var(--lilac-line);color:var(--lilac-deep)}
.draw-wrap{border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:10px}
#drawCanvas{display:block;width:100%;height:280px;touch-action:none}
.tools{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tool{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--lilac-deep)}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.tool.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.colors{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cdot.sel{border-color:var(--ink)}
.color-sep{height:1px;background:var(--line);margin:4px 0}
.draw-actions{display:flex;gap:8px}
.draw-actions .go-btn{margin-top:0;flex:1}
.reflect{display:none;margin-top:14px}
.reflect.show{display:block}
.read-btn{width:100%;border:1.5px solid var(--lilac-line);border-radius:12px;padding:12px;background:var(--lilac-soft);color:var(--lilac-deep);font-size:13px;font-weight:800;cursor:pointer;margin-bottom:10px}
.read-body{max-height:0;overflow:hidden;transition:max-height .4s}
.read-body.open{max-height:500px}
.reflect-card{background:var(--butter2);border:1px solid var(--butter-line);border-radius:14px;padding:14px;margin-bottom:10px}
.reflect-card .rq{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;color:var(--butter-ink);margin-bottom:6px}
.reflect-card .rh{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--butter-mut);margin-bottom:6px}
.day-mode-row{display:flex;gap:8px;margin-bottom:12px}
.day-mode-btn{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--mut);font-size:12px;font-weight:800;cursor:pointer}
.day-mode-btn.sel{background:var(--lilac-soft);border-color:var(--lilac);color:var(--lilac-deep)}
.day-prog{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--mut)}
.day-prog b{color:var(--lilac-deep)}
.day-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
.day-item.done{opacity:.5}
.day-item.done .di-title{text-decoration:line-through}
.di-t{font-weight:800;font-size:13px;color:var(--lilac-deep);min-width:44px}
.di-body{flex:1}
.di-title{font-size:13px;font-weight:600}
.di-why{font-size:10px;color:var(--mut);font-style:italic}
.di-check{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--lilac-line);background:var(--card);color:var(--lilac-deep);font-size:14px;font-weight:800;cursor:pointer}
.day-item.done .di-check{background:var(--lilac);border-color:var(--lilac);color:#fff}
.di-del{border:none;background:none;color:#b0aa9d;font-size:16px;cursor:pointer}
.day-empty{text-align:center;color:#a49e91;font-size:13px;padding:20px}
.day-add{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.day-add .da-row{display:flex;gap:6px;margin-bottom:6px}
#dayTime{width:90px}
.cat-row{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.cat-pill{border:1.5px solid var(--line);border-radius:100px;padding:5px 9px;background:var(--card);font-size:10px;font-weight:700;color:var(--mut);cursor:pointer}
.cat-pill.sel{border-color:transparent;color:#fff}
.cat-pill[data-c="care"].sel{background:#5F7A5C}
.cat-pill[data-c="work"].sel{background:#77688B}
.cat-pill[data-c="people"].sel{background:#A06A78}
.cat-pill[data-c="food"].sel{background:#A8762F}
.cat-pill[data-c="rest"].sel{background:#5B748C}
.cat-pill[data-c="task"].sel{background:#7A6852}
.tpl-lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.tpl-row{display:flex;gap:6px;margin-bottom:10px}
.tpl-btn{flex:1;border:1.5px solid var(--butter-line);border-radius:10px;padding:9px;background:var(--butter2);color:var(--butter-ink);font-size:11px;font-weight:800;cursor:pointer}
.day-tip{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:12px;padding:10px;font-size:12px;color:var(--butter-ink);line-height:1.5}
.grid-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:12px}
.grid-hour{display:flex;min-height:40px;border-bottom:1px solid var(--line)}
.grid-hour:last-child{border-bottom:none}
.grid-h{width:36px;font-size:10px;font-weight:800;color:var(--mut);padding:6px 2px}
.grid-h.now{color:var(--lilac-deep)}
.grid-cell{flex:1;padding:4px}
.grid-slot{display:flex;align-items:center;gap:6px;padding:5px;border-left:2px solid transparent;border-radius:6px;cursor:pointer}
.grid-slot.has{border-left-color:var(--lilac);cursor:default}
.grid-slot .g-title{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-slot.done .g-title{text-decoration:line-through;color:var(--mut)}
.grid-slot .g-empty{flex:1;font-size:11px;color:#b0aa9d;font-style:italic}
.grid-slot .g-mini{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--lilac-line);background:var(--card);color:var(--lilac-deep);font-size:10px;font-weight:800;cursor:pointer}
.grid-slot.done .g-mini{background:var(--lilac);border-color:var(--lilac);color:#fff}
.grid-slot .g-del{border:none;background:none;color:#b0aa9d;font-size:14px;cursor:pointer;display:none}
.grid-slot.has .g-del{display:inline}
.day-summary{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px;margin-bottom:12px}
.day-summary .ds-t{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--lilac-deep);margin-bottom:6px}
.day-summary .ds-bar{display:flex;height:8px;border-radius:100px;overflow:hidden;background:var(--line);margin-bottom:8px}
.day-summary .ds-bar span{display:block;height:100%}
.day-summary .ds-row{display:flex;flex-wrap:wrap;gap:5px;font-size:10px}
.day-summary .ds-row span{display:flex;align-items:center;gap:3px}
.day-summary .ds-row i{width:7px;height:7px;border-radius:50%}
.breath-big{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 16px}
.breath-big i{width:70px;height:70px;border-radius:50%;background:var(--lilac-soft);border:2px solid var(--lilac);animation:breathe 8s infinite}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.breath-big span{font-size:13px;color:var(--mut);font-weight:700;text-align:center}
.sos-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sos-item{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-weight:600;cursor:pointer}
.sos-item .si-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--lilac-line);flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.sos-item.on{border-color:var(--lilac);background:var(--lilac-soft)}
.sos-item.on .si-box{background:var(--lilac);border-color:var(--lilac)}
.faq-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.faq-chip{border:1.5px solid var(--line);border-radius:100px;padding:6px 10px;background:var(--card);font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
.faq-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:4px 2px;min-height:200px}
.faq-msg{max-width:85%;border-radius:12px;padding:10px;font-size:13px;line-height:1.5}
.faq-msg.u{align-self:flex-end;background:var(--lilac-soft)}
.faq-msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:24px}
.hcard{background:var(--card);border:1px solid var(--butter-line);border-radius:14px;padding:14px;margin-bottom:10px}
.hdate{font-size:10px;font-weight:800;color:var(--butter-mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
.hrow{margin-bottom:6px}
.hrow span{font-size:9px;font-weight:800;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:.1em}
.hrow p{font-size:13px;line-height:1.5;margin-top:2px}
.hempty{text-align:center;color:#a49e91;padding:40px 20px;font-size:14px}
.clear-link{display:block;margin:6px auto 0;border:none;background:none;color:#8F5A4A;font-size:12px;font-weight:700;cursor:pointer}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav .cm{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:600}
.cal-nav button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--lilac-deep);font-size:16px;cursor:pointer}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-weekdays span{text-align:center;font-size:9px;font-weight:800;color:var(--mut)}
.cal-cell{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
.cal-cell.empty{border:none;background:transparent}
.cal-cell.today{border-color:var(--lilac)}
.cal-cell.filled{color:var(--ink)}
.cal-cell .cdot-mini{width:7px;height:7px;border-radius:50%;margin-top:2px}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.cal-legend .lg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut)}
.cal-legend .lg i{width:10px;height:10px;border-radius:50%}
.cal-summary{text-align:center;font-size:14px;color:var(--mut);margin-top:12px;font-family:var(--serif);font-style:italic}
.cal-summary b{color:var(--lilac-deep)}
.mood-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--lilac-line);border-radius:20px 20px 0 0;padding:18px 20px max(20px,env(safe-area-inset-bottom));transform:translateY(110%);transition:.4s;z-index:40}
.mood-sheet.show{transform:none}
.mood-sheet .ms-t{font-family:var(--serif);font-style:italic;font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.mood-sheet .ms-d{text-align:center;font-size:11px;color:var(--mut);margin-bottom:12px}
.ms-moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}

function pickFresh(arr,key){let i=Math.floor(Math.random()*arr.length);if(arr.length>1&&lastPick[key]===i)i=(i+1)%arr.length;lastPick[key]=i;return arr[i];}
function detectEmotion(tx){const l=tx.toLowerCase();for(const k in AI){if(AI[k].keys.some(w=>l.includes(w)))return AI[k];}return null;}
function findSmartQuestion(tx){const e=detectEmotion(tx);return pickFresh(e?e.questions:FB_QUESTIONS,'q');}
function findMirrorResponse(tx){const e=detectEmotion(tx);if(e)return pickFresh(e.replies,'r')+' '+pickFresh(e.questions,'q');return pickFresh(FB_REPLIES,'r')+' '+pickFresh(FB_QUESTIONS,'q');}

function drawQR(){const cv=$('#qrCanvas'),cx=cv.getContext('2d');const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,200,200);cx.drawImage(img,0,0,200,200);};img.onerror=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,200,200);cx.fillStyle='#2B312E';cx.font='600 12px Manrope';cx.textAlign='center';cx.fillText(SITE,100,100);};img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(SITE)+'&color=2B312E&bgcolor=FFFFFF';}

function addUser(text,first){$('#thread').style.display='block';$('#hintEmpty').style.display='none';const e=document.createElement('div');e.className='entry'+(first?' first':'');e.innerHTML='<div class="who">'+(first?(lang==='ru'?'Начало':'Start'):(lang==='ru'?'Ответ':'Answer'))+'</div><div class="txt">'+esc(text)+'</div>';$('#thread').appendChild(e);scrollDown();}
function thinking(cb){const e=document.createElement('div');e.className='thinking';e.innerHTML='<i></i><i></i><i></i>';$('#thread').appendChild(e);scrollDown();setTimeout(()=>{e.remove();cb();},900);}
function askWhy(n){const e=document.createElement('div');e.className='entry prompt';e.innerHTML='<div class="q">'+(lang==='ru'?'Почему?':'Why?')+'</div><div class="num">'+(lang==='ru'?'вопрос ':'q ')+n+'/6</div>';$('#thread').appendChild(e);scrollDown();setProgress(n,lang==='ru'?'честно':'honest');$('#msgInput').placeholder=lang==='ru'?'Потому что…':'Because…';$('#msgInput').focus();}
function askSmart(a){const q=findSmartQuestion(a);const e=document.createElement('div');e.className='entry prompt smart';e.innerHTML='<div class="q">'+q+'</div><div class="num">'+(lang==='ru'?'вопрос 3/6':'q 3/6')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(3,lang==='ru'?'честно':'honest');$('#msgInput').placeholder=lang==='ru'?'Подумай…':'Think…';$('#msgInput').focus();}
function askAction(){const e=document.createElement('div');e.className='entry prompt act';e.innerHTML='<div class="q">'+(lang==='ru'?'Что сделать?':'What to do?')+'</div><div class="num">'+(lang==='ru'?'7-й вопрос':'7th q')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(6,lang==='ru'?'шаг':'step');$('#msgInput').placeholder=lang==='ru'?'Маленький шаг…':'Small step…';$('#msgInput').focus();}
function setProgress(n,cap){$$('.pdot').forEach((d,i)=>d.classList.toggle('on',i<n));$('#pcap').textContent=cap;}
function useSmart(){return mode==='empathy'||mode==='draw';}
function submit(){const inp=$('#msgInput'),v=inp.value.trim();if(!v){inp.style.borderColor='#8F5A4A';setTimeout(()=>inp.style.borderColor='',600);return;}inp.value='';if(phase==='start'){session={start:v,whys:[],action:null};addUser(v,true);phase='whys';thinking(()=>askWhy(1));}else if(phase==='whys'){session.whys.push(v);addUser(v,false);if(session.whys.length===2&&useSmart())thinking(()=>askSmart(v));else if(session.whys.length<6)thinking(()=>askWhy(session.whys.length+1));else{phase='action';thinking(()=>askAction());}}else if(phase==='action'){session.action=v;addUser(v,false);finish();}}
$('#sendBtn').onclick=submit;$('#msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
function finish(){const d=new Date();const done={date:d.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'long'})+', '+d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US',{hour:'2-digit',minute:'2-digit'}),start:session.start,root:session.whys[session.whys.length-1],action:session.action,capsule:false};if(mode==='capsule')done.capsule=true;history.push(done);saveHist();markChallengeDay();$('#rootText').textContent='«'+done.root+'»';$('#stepText').textContent=done.action;if(mode==='mirror'){const all=session.start+' '+session.whys.join(' ')+' '+session.action;$('#mirrorText').textContent=findMirrorResponse(all);$('#mirrorBlock').style.display='block';}else $('#mirrorBlock').style.display='none';buildMoodRowDone();const dc=$('#scr-done .done-check svg'),cl=dc.cloneNode(true);dc.parentNode.replaceChild(cl,dc);setTimeout(()=>{go('scr-done');if(mode==='capsule')toast(t('capSaved'));},600);}
function markChallengeDay(){const k=todayKey();if(!challenge.days.includes(k)){challenge.days.push(k);saveChallenge();}}
function buildMoodRowDone(){$('#moodRowDone').innerHTML=MOOD_COLORS.map((c,i)=>'<div class="mood-opt" data-mi="'+i+'" style="background:'+c+'"><span>'+t('moods')[i]+'</span></div>').join('');const today=moods[todayKey()];if(today&&$('#moodRowDone').children[today.mood])$('#moodRowDone').children[today.mood].classList.add('sel');$$('#moodRowDone .mood-opt').forEach(o=>{o.onclick=()=>{$$('#moodRowDone .mood-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');moods[todayKey()]={mood:+o.dataset.mi,note:(moods[todayKey()]&&moods[todayKey()].note)||''};saveMoods();toast(t('moodSaved'));};});}

function renderHist(){const L=$('#histList');if(!history.length){L.innerHTML='<div class="hempty">'+(lang==='ru'?'Пусто':'Empty')+'</div>';return;}let html=history.slice().reverse().map(s=>'<div class="hcard'+(s.capsule?' capsule':'')+'"><div class="hdate">'+esc(s.date)+(s.capsule?'<span style="color:var(--butter-ink);font-size:9px">🌱</span>':'')+'</div><div class="hrow"><span>'+(lang==='ru'?'Начало':'Start')+'</span><p>'+esc(s.start)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Корень':'Root')+'</span><p>'+esc(s.root)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Шаг':'Step')+'</span><p style="color:#5F7A5C;font-weight:700">'+esc(s.action)+'</p></div></div>').join('');html+='<button class="clear-link" id="clearHist">'+(lang==='ru'?'Очистить':'Clear')+'</button>';L.innerHTML=html;$('#clearHist').onclick=()=>{history=[];saveHist();renderHist();toast(t('histCleared'));};}
let calYear=null,calMonth=null,editingDate=null;
const WD_RU=['пн','вт','ср','чт','пт','сб','вс'],WD_EN=['mo','tu','we','th','fr','sa','su'];
const MON_RU=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function renderCalendar(){const now=new Date();if(calYear==null){calYear=now.getFullYear();calMonth=now.getMonth();}$('#calWeekdays').innerHTML=(lang==='ru'?WD_RU:WD_EN).map(w=>'<span>'+w+'</span>').join('');$('#calMonth').textContent=(lang==='ru'?MON_RU:MON_EN)[calMonth]+' '+calYear;const first=new Date(calYear,calMonth,1);let startDay=(first.getDay()+6)%7;const days=new Date(calYear,calMonth+1,0).getDate();let cells='';for(let i=0;i<startDay;i++)cells+='<div class="cal-cell empty"></div>';for(let d=1;d<=days;d++){const key=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),m=moods[key],isToday=key===todayKey();cells+='<div class="cal-cell'+(isToday?' today':'')+(m?' filled':'')+'" data-date="'+key+'">'+d+(m?'<div class="cdot-mini" style="background:'+MOOD_COLORS[m.mood]+'"></div>':'')+'</div>';}$('#calGrid').innerHTML=cells;$$('#calGrid .cal-cell[data-date]').forEach(c=>{c.onclick=()=>openMoodSheet(c.dataset.date);});renderLegend();renderSummary();}
function renderLegend(){$('#calLegend').innerHTML=t('moods').map((m,i)=>'<div class="lg"><i style="background:'+MOOD_COLORS[i]+'"></i>'+m+'</div>').join('');}
function renderSummary(){const prefix=calYear+'-'+String(calMonth+1).padStart(2,'0'),counts={};let total=0;Object.keys(moods).forEach(k=>{if(k.startsWith(prefix)){counts[moods[k].mood]=(counts[moods[k].mood]||0)+1;total++;}});if(total===0){$('#calSummary').innerHTML=lang==='ru'?'Нет отметок':'No marks';return;}let best=0;Object.keys(counts).forEach(k=>{if(counts[k]>counts[best])best=k;});$('#calSummary').innerHTML=t('summary')(t('moods')[+best]);}
$('#prevMonth').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();};$('#nextMonth').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();};$('#moodBackBtn').onclick=()=>{$('#moodSheet').classList.remove('show');go('scr-home');};
function openMoodSheet(date){editingDate=date;const parts=date.split('-');$('#msDate').textContent=+parts[2]+' '+(lang==='ru'?MON_RU:MON_EN)[+parts[1]-1];const cur=moods[date];$('#msMoods').innerHTML=t('moods').map((m,i)=>'<div class="ms-mood'+(cur&&cur.mood===i?' sel':'')+'" data-mi="'+i+'"><i style="background:'+MOOD_COLORS[i]+'"></i><span>'+m+'</span></div>').join('');$$('#msMoods .ms-mood').forEach(o=>{o.onclick=()=>{$$('#msMoods .ms-mood').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');};});$('#moodNote').value=(cur&&cur.note)||'';$('#moodSheet').classList.add('show');}
