<style>
:root{--ink:#2B312E;--mut:#6F7A72;--lilac:#7C9479;--lilac-deep:#5F7A5C;--lilac-soft:#DFE8DB;--lilac-line:#BCCBB6;--paper:#F2EFE8;--card:#FAF8F3;--line:#E2DCCE;--butter:#EAE0CC;--butter2:#F0E9DA;--butter-soft:#F4EEE1;--butter-line:#D6C9AC;--butter-ink:#6B5F45;--butter-mut:#8A7C5C;--serif:'Cormorant Garamond',serif;--sans:'Manrope',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#E7E3D9;-webkit-tap-highlight-color:transparent}
.app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px #2a243522}
.scr{position:absolute;inset:0;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .4s,transform .4s;display:flex;flex-direction:column}
.scr.active{opacity:1;transform:none;pointer-events:auto}
button{font-family:var(--sans)}
#scr-onb{padding:max(20px,env(safe-area-inset-top)) 30px max(26px,env(safe-area-inset-bottom))}
.onb-top{text-align:center;font-family:var(--serif);font-size:22px;font-weight:600;cursor:pointer;user-select:none}
.onb-top em{font-style:italic;color:var(--lilac-deep)}
.onb-slides{flex:1;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;opacity:0;transform:translateX(36px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;padding:0 6px}
.slide.active{opacity:1;transform:none}
.slide .st{font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;line-height:1.45;color:var(--ink);max-width:300px}
.slide .st b{color:var(--lilac-deep);font-weight:600}
.slide .benefit{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px 16px;font-size:13px;line-height:1.5;color:var(--butter-ink);max-width:280px}
.onb-bottom{display:flex;flex-direction:column;align-items:center;gap:16px}
.onb-dots{display:flex;gap:7px}
.odot{width:7px;height:7px;border-radius:50%;background:#DDD8CC;transition:.35s}
.odot.on{background:var(--butter-mut);width:20px;border-radius:100px}
#scr-auth{padding:24px 30px max(26px,env(safe-area-inset-bottom));justify-content:center;overflow-y:auto}
.logo-dots{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.logo-dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--lilac);opacity:0;animation:dotIn .5s forwards}
.logo-dots i:nth-child(5),.logo-dots i:nth-child(6){background:var(--butter);border-color:var(--butter-line)}
.logo-dots i:nth-child(1){animation-delay:.1s}.logo-dots i:nth-child(2){animation-delay:.2s}.logo-dots i:nth-child(3){animation-delay:.3s}.logo-dots i:nth-child(4){animation-delay:.4s}.logo-dots i:nth-child(5){animation-delay:.5s}.logo-dots i:nth-child(6){animation-delay:.6s}
@keyframes dotIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.wordmark{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1;cursor:pointer;user-select:none}
.wordmark em{font-style:italic;color:var(--lilac-deep)}
.auth-sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mut);margin:9px 0 24px}
.field-lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.field-lbl.mt{margin-top:18px}
#nameInput,#pinInputReg,#pinInput,#phoneInput{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:15px 16px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--card);outline:none;transition:.25s}
#nameInput:focus,#pinInputReg:focus,#pinInput:focus,#phoneInput:focus{border-color:var(--lilac);box-shadow:0 0 0 4px #7c94791c}
#pinInputReg{letter-spacing:8px;font-weight:800;text-align:center}
.field-hint{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.45}
.go-btn{width:100%;margin-top:14px;border:none;border-radius:15px;padding:16px;font-size:15px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer;transition:.25s;box-shadow:0 10px 22px #7c947930}
.go-btn:hover{background:var(--lilac-deep)}
.go-btn:active{transform:scale(.98)}
.go-btn.butter{background:var(--butter);color:var(--butter-ink);box-shadow:0 10px 22px #eae0cc55}
.go-btn.butter:hover{background:#E0D5BC}
.go-btn.outline{background:transparent;color:var(--lilac-deep);border:1.5px solid var(--lilac-line);box-shadow:none}
.go-btn.outline:hover{border-color:var(--lilac)}
.priv-note{margin-top:20px;background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.55;color:var(--butter-ink)}
.disclaimer{margin-top:14px;font-size:11px;line-height:1.5;color:#a49e91;text-align:center}
#scr-pin{padding:30px;justify-content:center;align-items:center;text-align:center}
.pin-lock{font-size:44px;margin-bottom:14px}
#scr-pin h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;margin-bottom:8px}
#scr-pin .ps{font-size:13px;color:var(--mut);margin-bottom:24px}
#pinInput{max-width:200px;text-align:center;letter-spacing:12px;font-size:20px;font-weight:800}
#scr-home{padding:max(16px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
.home-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.home-top .wm{font-family:var(--serif);font-size:23px;font-weight:600;cursor:pointer;user-select:none}
.home-top .wm em{font-style:italic;color:var(--lilac-deep)}
.home-top .acts{display:flex;gap:2px}
.ibtn{border:none;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);cursor:pointer;transition:.2s}
.ibtn:hover{background:var(--butter-soft);color:var(--butter-mut)}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.greet{font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.3;margin-bottom:14px}
.greet b{color:var(--lilac-deep);font-weight:600}
.challenge{background:var(--lilac-soft);border:1px solid var(--lilac-line);border-radius:18px;padding:15px 17px;margin-bottom:14px}
.challenge .ch-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.challenge .ch-t{font-family:var(--serif);font-style:italic;font-size:18px;font-weight:600;color:var(--lilac-deep)}
.challenge .ch-d{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--butter-mut);text-transform:uppercase}
.ch-dots{display:flex;gap:7px}
.ch-dot{flex:1;height:8px;border-radius:100px;background:#fff;border:1px solid var(--lilac-line);transition:.3s}
.ch-dot.on{background:var(--lilac);border-color:var(--lilac)}
.challenge .ch-msg{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.5}
.youalone{text-align:center;font-size:12px;color:var(--mut);margin-bottom:14px;line-height:1.5}
.youalone b{color:var(--lilac-deep);font-weight:800}
.ann{background:var(--butter2);border:1px solid var(--butter-line);color:var(--butter-ink);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.quote-card{border-radius:18px;padding:18px 18px 16px;margin-bottom:12px;position:relative}
.quote-card.lil{background:var(--lilac-soft);border:1px solid var(--lilac-line)}
.quote-card.but{background:var(--butter2);border:1px solid var(--butter-line)}
.quote-card::before{content:"❝";position:absolute;top:8px;left:14px;font-family:var(--serif);font-size:28px;line-height:1}
.quote-card.lil::before{color:var(--lilac)}
.quote-card.but::before{color:var(--butter-mut)}
.qc-lbl{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;padding-left:20px}
.quote-card.lil .qc-lbl{color:var(--lilac-deep)}
.quote-card.but .qc-lbl{color:var(--butter-mut)}
.qc-q{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45;padding-left:20px}
.quote-card.lil .qc-q{color:#39423B}
.quote-card.but .qc-q{color:var(--butter-ink)}
.qc-a{font-size:11px;font-weight:700;margin-top:6px;text-align:right}
.quote-card.lil .qc-a{color:var(--lilac-deep)}
.quote-card.but .qc-a{color:var(--butter-mut)}
.tiles-lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:18px;padding:17px 15px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.25s;text-align:left}
.tile .ti{color:var(--lilac-deep)}
.tile .ti svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tt{font-family:var(--serif);font-style:italic;font-weight:600;font-size:19px;margin-top:9px;color:var(--ink)}
.tile .td{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.4}
.tile.sel{border-color:var(--lilac);background:var(--lilac-soft);box-shadow:0 8px 20px #7c947926;transform:translateY(-2px)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:15px}
.tile.wide .ti svg{width:28px;height:28px}
.start-btn{width:100%;margin-top:18px;border:none;border-radius:18px;padding:18px;font-size:16px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer;transition:.25s;box-shadow:0 12px 26px #7c947930}
.start-btn:hover{background:var(--lilac-deep);transform:translateY(-2px)}
.start-btn:active{transform:scale(.98)}
.home-foot{text-align:center;font-size:11px;color:#a49e91;margin-top:18px;line-height:1.5}
.menu-btn{width:100%;border:none;border-radius:13px;padding:14px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;text-align:left;transition:.2s}
.menu-btn:hover{border-color:var(--lilac);background:var(--lilac-soft)}
.menu-about{font-size:13px;line-height:1.6;color:var(--mut);max-height:0;overflow:hidden;transition:max-height .4s}
.menu-about.open{max-height:200px;padding:4px 2px 10px}
#scr-main{display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 6px}
.topbar .wm{font-family:var(--serif);font-size:21px;font-weight:600}
.topbar .wm em{font-style:italic;color:var(--lilac-deep)}
.inputbar{display:flex;gap:9px;padding:6px 16px 10px}
#msgInput,#faqInput{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:100px;padding:13px 19px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--card);outline:none;transition:.25s}
#msgInput:focus,#faqInput:focus{border-color:var(--lilac);box-shadow:0 0 0 4px #7c947917}
#msgInput::placeholder,#faqInput::placeholder{color:#a49e91}
.send{width:46px;height:46px;flex-shrink:0;border:none;border-radius:50%;background:var(--butter);display:grid;place-items:center;cursor:pointer;transition:.25s;box-shadow:0 8px 18px #eae0cc70}
.send:hover{background:#E0D5BC}
.send:active{transform:scale(.92)}
.send svg{width:19px;height:19px;fill:none;stroke:var(--butter-ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.progress{display:flex;align-items:center;justify-content:center;gap:9px;padding:2px 0 6px}
.pdot{width:7px;height:7px;border-radius:50%;background:#DDD8CC;transition:.4s}
.pdot.on{background:var(--lilac);transform:scale(1.2)}
.pdot.on:nth-child(5),.pdot.on:nth-child(6){background:var(--butter-mut)}
.pcap{font-size:10px;font-weight:800;letter-spacing:.1em;color:#A49E91;margin-left:8px;text-transform:uppercase}
.canvas{flex:1;overflow-y:auto;padding:10px 24px max(40px,env(safe-area-inset-bottom));scrollbar-width:none}
.canvas::-webkit-scrollbar{display:none}
.hint-empty{text-align:center;padding:50px 22px;animation:pulseSoft 3s ease-in-out infinite}
.hint-empty .hd{font-family:var(--serif);font-style:italic;font-size:22px;color:#98a094;margin-bottom:10px}
.hint-empty p{font-size:13.5px;line-height:1.65;color:#a49e91}
@keyframes pulseSoft{0%,100%{opacity:.7}50%{opacity:1}}
.thread{border-left:1.5px solid var(--butter-line);margin-left:6px;padding:6px 0 10px 26px}
.entry{position:relative;margin-bottom:26px;animation:rise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.entry::before{content:"";position:absolute;left:-31px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--butter-mut)}
.entry.first::before{background:var(--butter-mut);border-color:var(--butter-mut)}
.entry.guide{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px 14px;margin-left:0;margin-bottom:22px}
.entry.guide::before{display:none}
.entry.guide .gt{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--butter-mut);margin-bottom:6px}
.entry.guide .gb{font-size:13px;line-height:1.55;color:var(--butter-ink)}
.entry .who{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:5px}
.entry .txt{font-size:15px;line-height:1.5;color:#2B312E;font-weight:500}
.entry.first .txt{font-size:17px;font-weight:600}
.entry.prompt .q{font-family:var(--serif);font-style:italic;font-weight:600;font-size:33px;line-height:1.15;color:var(--ink)}
.entry.prompt.smart .q{font-size:26px;color:var(--lilac-deep)}
.entry.prompt.act .q{color:var(--butter-mut);font-size:27px}
.entry .num{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--lilac-line);margin-top:6px;text-transform:uppercase}
.thinking{display:flex;gap:6px;padding:10px 0;margin-bottom:20px;animation:rise .4s both}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--butter-mut);animation:bl 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
#scr-draw{padding:max(14px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
.draw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.draw-head h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:25px}
.draw-sub{font-size:15px;color:var(--mut);margin-bottom:12px;line-height:1.5;font-style:italic;font-family:var(--serif)}
.noise-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.noise-pill{border:1.5px solid var(--line);border-radius:100px;padding:6px 12px;background:var(--card);font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;transition:.2s}
.noise-pill.sel{background:var(--lilac);border-color:var(--lilac);color:#fff}
.method-row{display:flex;gap:10px;margin-bottom:12px}
.method{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);cursor:pointer;transition:.22s;text-align:left}
.method.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.method .mt{font-family:var(--serif);font-style:italic;font-size:16px;font-weight:600}
.method .md{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.music-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--butter-line);border-radius:100px;padding:9px;background:var(--butter2);color:var(--butter-ink);font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:.2s}
.music-btn.on{background:var(--lilac-soft);border-color:var(--lilac-line);color:var(--lilac-deep)}
.music-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.draw-wrap{border:1.5px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;margin-bottom:12px}
#drawCanvas{display:block;width:100%;height:300px;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:7px;justify-content:center;margin-bottom:11px}
.tool{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:.2s;color:var(--lilac-deep)}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.colors{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s}
.cdot.sel{border-color:var(--ink);transform:scale(1.18)}
.color-sep{width:100%;height:1px;background:var(--line);margin:2px 0 8px}
.draw-actions{display:flex;gap:10px}
.draw-actions .go-btn{margin-top:0}
.reflect{display:none;margin-top:16px}
.reflect.show{display:block}
.read-btn{width:100%;border:1.5px solid var(--lilac-line);border-radius:14px;padding:13px;background:var(--lilac-soft);color:var(--lilac-deep);font-size:13.5px;font-weight:800;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.read-body{max-height:0;overflow:hidden;transition:max-height .45s ease}
.read-body.open{max-height:600px}
.reflect-card{background:var(--butter2);border:1px solid var(--butter-line);border-radius:16px;padding:16px;margin-bottom:12px}
.reflect-card .rq{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;color:var(--butter-ink);margin-bottom:9px}
.reflect-card .rq:last-child{margin-bottom:0}
.reflect-card .rh{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--butter-mut);margin-bottom:8px}
#reflectInput{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:14px 16px;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--card);outline:none;margin-bottom:10px}
#reflectInput:focus{border-color:var(--lilac)}
#scr-day{padding:max(16px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));overflow-y:auto}
.day-mode-row{display:flex;gap:8px;margin-bottom:14px}
.day-mode-btn{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--mut);font-size:12px;font-weight:800;cursor:pointer;transition:.2s}
.day-mode-btn.sel{background:var(--lilac-soft);border-color:var(--lilac);color:var(--lilac-deep)}
.day-prog{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:16px;padding:13px 16px;margin-bottom:14px;font-size:13px;color:var(--mut);line-height:1.5}
.day-prog b{color:var(--lilac-deep)}
.day-list{margin-bottom:14px}
.day-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;animation:rise .4s both}

.wn-panel{width:100%;max-width:480px;background:var(--paper);border-radius:24px 24px 0 0;padding:max(22px,env(safe-area-inset-top)) 26px max(28px,env(safe-area-inset-bottom));transform:translateY(40px);transition:.4s}
.overlay.show .wn-panel{transform:none}
.wn-slides{position:relative;min-height:230px}
.wn-slide{position:absolute;inset:0;opacity:0;transform:translateX(30px);transition:.45s;pointer-events:none;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.wn-slide.active{opacity:1;transform:none}
.wn-slide .wi{font-size:46px}
.wn-slide .wt{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:600;line-height:1.4}
.wn-slide .wd{font-size:13.5px;color:var(--mut);line-height:1.6;max-width:300px}
.wn-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0}
.wn-arrow{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--lilac-line);background:var(--card);color:var(--lilac-deep);font-size:22px;cursor:pointer;transition:.2s}
.wn-arrow:active{transform:scale(.9)}
.wn-dots{display:flex;gap:7px}
.wn-dots i{width:7px;height:7px;border-radius:50%;background:#DDD8CC;transition:.3s}
.wn-dots i.on{background:var(--lilac);width:18px;border-radius:100px}
.wn-close{width:100%;border:none;border-radius:15px;padding:15px;background:var(--lilac);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.inst-step{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-bottom:12px}
.inst-step .n{width:26px;height:26px;border-radius:50%;background:var(--lilac);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.inst-step .s{font-size:14px;line-height:1.55;color:var(--ink)}
.egg-panel{text-align:center}
.egg-panel .ei{font-size:56px;margin-bottom:8px}
.egg-panel .et{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:600;margin-bottom:10px}
.egg-panel .em{font-size:14px;line-height:1.6;color:var(--mut);margin-bottom:18px}
.toast{position:absolute;bottom:26px;left:50%;transform:translate(-50%,16px);background:#2B312E;color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:100px;opacity:0;transition:.35s;z-index:70;white-space:nowrap;box-shadow:0 14px 34px #2a243544}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const FB_QUESTIONS=['Почему это важно именно сейчас?','Что самое главное для тебя в ситуации?','Что бы ты хотел почувствовать вместо этого?'];
const lastPick={};
function pickFresh(arr,key){let i=Math.floor(Math.random()*arr.length);if(arr.length>1&&lastPick[key]===i)i=(i+1)%arr.length;lastPick[key]=i;return arr[i];}
function detectEmotion(tx){const l=tx.toLowerCase();for(const k in AI){if(AI[k].keys.some(w=>l.includes(w)))return AI[k];}return null;}
function findSmartQuestion(tx){const e=detectEmotion(tx);return pickFresh(e?e.questions:FB_QUESTIONS,'q');}
function findMirrorResponse(tx){const e=detectEmotion(tx);if(e)return pickFresh(e.replies,'r')+' '+pickFresh(e.questions,'q');return pickFresh(FB_REPLIES,'r')+' '+pickFresh(FB_QUESTIONS,'q');}

function register(){
  const nm=$('#nameInput').value.trim();
  const ph=normPhone($('#phoneInput').value);
  const pw=$('#pinInputReg').value.trim();
  if(!nm){$('#nameInput').style.borderColor='#8F5A4A';setTimeout(()=>$('#nameInput').style.borderColor='',600);$('#nameInput').focus();return;}
  if(ph.length<10){toast(t('phoneNeeded'));$('#phoneInput').focus();return;}
  if(!/^\d{4}$/.test(pw)){toast(t('pinDigits'));$('#pinInputReg').focus();return;}
  name=nm;phone=ph;pin=pw;
  try{localStorage.setItem('sixwhy_name',name);localStorage.setItem('sixwhy_phone',phone);localStorage.setItem('sixwhy_pin',pin);localStorage.setItem('sixwhy_onb','1');}catch(e){}
  onboarded=true;initChallenge();enterApp();toast(t('welcome')(name));
}

const COLORS=['#8F4A42','#A8762F','#B08D1F','#5F7A5C','#4E7A72','#5B748C','#77688B','#A06A78','#7A6852','#2B312E'];

function sizeCanvas(){const w=dCan.parentElement.clientWidth,h=300,dpr=window.devicePixelRatio||1;dCan.width=w*dpr;dCan.height=h*dpr;dCtx.setTransform(dpr,0,0,dpr,0,0);dCtx.fillStyle='#FAF8F3';dCtx.fillRect(0,0,w,h);}
function openDraw(){$('#reflect').classList.remove('show');$('#readBody').classList.remove('open');buildReadBody();buildNoiseRow();go('scr-draw');setTimeout(sizeCanvas,60);}
function dPos(e){const r=dCan.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)];}
dCan.addEventListener('pointerdown',e=>{drawing=true;[lx,ly]=dPos(e);dCan.setPointerCapture(e.pointerId);seg(lx,ly);});
dCan.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=dPos(e);seg(x,y);[lx,ly]=[x,y];});
dCan.addEventListener('pointerup',()=>drawing=false);

function seg(x,y){const tt=TOOLS[curTool];dCtx.globalAlpha=tt.a;dCtx.strokeStyle=curColor;dCtx.lineWidth=tt.w;dCtx.lineCap='round';dCtx.lineJoin='round';dCtx.beginPath();dCtx.moveTo(lx,ly);dCtx.lineTo(x,y);dCtx.stroke();dCtx.globalAlpha=1;}

let noiseOn=false,noiseCtx=null,noiseSrc=null,noiseGain=null;
function uiOn(){$('#musicBtn').classList.add('on');$('#musicBtn').querySelector('span').textContent=t('musicOff');}
function uiOff(){$('#musicBtn').classList.remove('on');$('#musicBtn').querySelector('span').textContent=t('musicOn');}
function buildNoiseRow(){
  $('#noiseRow').innerHTML=NOISES.map(n=>'<div class="noise-pill'+(noiseType===n.k?' sel':'')+'" data-n="'+n.k+'">'+(lang==='ru'?n.ru:n.en)+'</div>').join('');
  $$('#noiseRow .noise-pill').forEach(p=>{p.onclick=()=>{noiseType=p.dataset.n;try{localStorage.setItem('sixwhy_noise',noiseType);}catch(e){}buildNoiseRow();if(noiseOn)startMusic();};});
}
function makeNoiseBuffer(ctx,type){
  const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,lp=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type==='white'){d[i]=w*0.5;}else if(type==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.96900*b2+w*.1538520;b3=.86650*b3+w*.3104856;b4=.55000*b4+w*.5329522;b5=-.7616*b5-w*.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}else{lp=lp+.30*(w-lp);d[i]=lp*1.6;}}
  return buf;
}
function startMusic(){
  noiseCtx=noiseCtx||new (window.AudioContext||window.webkitAudioContext)();if(noiseCtx.state==='suspended')noiseCtx.resume();
  stopNoise();noiseSrc=noiseCtx.createBufferSource();noiseSrc.buffer=makeNoiseBuffer(noiseCtx,noiseType);noiseSrc.loop=true;
  const hp=noiseCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=120;
  const lp=noiseCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=noiseType==='white'?9000:6000;
  noiseGain=noiseCtx.createGain();noiseGain.gain.value=0;
  noiseSrc.connect(hp);hp.connect(lp);lp.connect(noiseGain);noiseGain.connect(noiseCtx.destination);
  noiseSrc.start();noiseGain.gain.linearRampToValueAtTime(0.09,noiseCtx.currentTime+1.0);noiseOn=true;uiOn();
}
function stopNoise(){if(noiseSrc){try{noiseGain.gain.linearRampToValueAtTime(0,noiseCtx.currentTime+0.4);noiseSrc.stop(noiseCtx.currentTime+0.5);}catch(e){}noiseSrc=null;}}
function stopMusic(){stopNoise();noiseOn=false;uiOff();}
$('#musicBtn').onclick=()=>{noiseOn?stopMusic():startMusic();};

    html+='<div class="grid-wrap">';for(let h=6;h<=23;h++){const hourStr=String(h).padStart(2,'0'),inHour=dayData.items.filter(i=>parseInt(i.t.split(':')[0],10)===h);html+='<div class="grid-hour"><div class="grid-h'+(h===curH?' now':'')+'">'+hourStr+'</div><div class="grid-cell">';if(inHour.length===0){html+='<div class="grid-slot" data-h="'+hourStr+'"><div class="g-empty">'+t('gridEmpty')+'</div></div>';}else{inHour.forEach(it=>{const real=dayData.items.indexOf(it);html+='<div class="grid-slot has'+(it.done?' done':'')+'" data-cat="'+(it.cat||'task')+'"><div class="g-title">'+esc(it.title)+'</div><button class="g-mini" data-chk="'+real+'">✓</button><button class="g-del" data-del="'+real+'">×</button></div>';});}html+='</div></div>';}html+='</div>';
    $('#dayList').innerHTML=html;
    $$('#dayList .grid-slot:not(.has)').forEach(s=>{s.onclick=()=>openDaySheet(s.dataset.h);});
    $$('#dayList .g-mini').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();const it=dayData.items[+b.dataset.chk];it.done=!it.done;saveDay();renderDay();};});

  }

function renderFaq(){

function askFaq(text){
  $('#faqLog').insertAdjacentHTML('beforeend','<div class="faq-msg u">'+esc(text)+'</div>');
  $('#faqLog').scrollTop=$('#faqLog').scrollHeight;
  const l=text.toLowerCase();
  let best=null,bestScore=0;
  FAQ.forEach(f=>{const q=(f.q+' '+f.k).toLowerCase();let score=0;q.split(/\s+/).forEach(w=>{if(w.length>3&&l.includes(w))score++;});if(score>bestScore){bestScore=score;best=f;}});
  setTimeout(()=>{
    const reply=best?best.a:t('faqNo');
    $('#faqLog').insertAdjacentHTML('beforeend','<div class="faq-msg b">'+reply+'</div>');
    $('#faqLog').scrollTop=$('#faqLog').scrollHeight;
  },400);
}

$('#removePinBtn').onclick=()=>{pin='';try{localStorage.removeItem('sixwhy_pin');}catch(e){}renderProf();toast(t('pinRemoved'));};
$$('.lang-row button').forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('sixwhy_lang',lang);}catch(e){}applyI18N();buildOnb();showOnb(onbIdx);buildReadBody();buildNoiseRow();renderHome();renderChallenge();renderYouAlone();renderProf();renderDay();toast(lang==='ru'?'Русский':'English');};});
$('#statsBtn').onclick=()=>window.open('https://github.com/singdarrad-oss/-SixWhy/graphs/traffic','_blank');
$('#qrBtnProf').onclick=()=>{drawQR();go('scr-qr');};

  stopMusic();
  try{['sixwhy_name','sixwhy_phone','sixwhy_onb','sixwhy_mode','sixwhy_pin','sixwhy_lang'].forEach(k=>localStorage.removeItem(k));}catch(e){}

/* экспорт / импорт */
function buildBackup(){
  return {v:APP_VERSION,name,phone,pin,moods,history,challenge,dayData,capsules:JSON.parse(localStorage.getItem('sixwhy_capsules')||'[]'),creatorActive:isCreator?'1':'0',exportedAt:new Date().toISOString()};
}
function restoreBackup(d){
  if(d.name){name=d.name;try{localStorage.setItem('sixwhy_name',name);}catch(e){}}
  if(d.phone){phone=d.phone;try{localStorage.setItem('sixwhy_phone',phone);}catch(e){}}
  if(d.pin){pin=d.pin;try{localStorage.setItem('sixwhy_pin',pin);}catch(e){}}
  if(d.moods){moods=d.moods;saveMoods();}
  if(d.history){history=d.history;saveHist();}
  if(d.challenge){challenge=d.challenge;saveChallenge();}
  if(d.dayData){dayData=d.dayData;saveDay();}
  if(d.capsules){try{localStorage.setItem('sixwhy_capsules',JSON.stringify(d.capsules));}catch(e){}}
  if(d.creatorActive==='1'){isCreator=true;try{localStorage.setItem('sixwhy_creator_active','1');}catch(e){}}
}
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(buildBackup(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='sixwhy-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url);
  toast(t('backupDone'));
};
$('#importBtn').onclick=()=>$('#importFile').click();

/* капсулы времени */
let capsules=[];try{capsules=JSON.parse(localStorage.getItem('sixwhy_capsules')||'[]');}catch(e){capsules=[];}
function saveCapsules(){try{localStorage.setItem('sixwhy_capsules',JSON.stringify(capsules));}catch(e){}}
$('#capsuleTimeBtn').onclick=()=>{renderCapsules();go('scr-capsule');};
$('#capBackBtn').onclick=()=>go('scr-prof');
function renderCapsules(){
  const now=Date.now();
  if(!capsules.length){$('#capList').innerHTML='<div class="day-empty">'+t('capsuleEmpty')+'</div>';return;}
  $('#capList').innerHTML=capsules.map(c=>{const locked=c.openAt>now;return '<div class="capsule-item'+(locked?' locked':'')+'"><div class="ci-date">'+(locked?t('capsuleLocked')+' '+new Date(c.openAt).toLocaleDateString(lang==='ru'?'ru-RU':'en-US'):t('capsuleOpen'))+'</div><div class="ci-body">'+(locked?'· · · · ·':esc(c.text))+'</div></div>';}).join('');
}
$('#capSave').onclick=()=>{const txt=$('#capText').value.trim(),d=$('#capDate').value;if(!txt){toast(t('capNeedText'));return;}if(!d){toast(t('capNeedDate'));return;}const openAt=new Date(d+'T09:00:00').getTime();if(openAt<=Date.now()){toast(t('capDatePast'));return;}capsules.push({text:txt,openAt,createdAt:Date.now()});saveCapsules();$('#capText').value='';$('#capDate').value='';renderCapsules();toast(t('capSaved'));};

function drawQR(){
  const cv=$('#qrCanvas'),cx=cv.getContext('2d');const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,220,220);cx.drawImage(img,10,10,200,200);};
  img.onerror=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,220,220);cx.fillStyle='#2B312E';cx.font='600 13px Manrope';cx.textAlign='center';cx.fillText(SITE,110,110);};
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(SITE)+'&color=2B312E&bgcolor=FFFFFF';
}

/* пасхалка */
let logoTaps=0,logoTimer=null;
function egg(){$('#eggI').textContent='🌿';$('#eggT').textContent=t('egg').t;$('#eggM').textContent=t('egg').m;$('#eggOverlay').classList.add('show');}
$('#eggClose').onclick=()=>$('#eggOverlay').classList.remove('show');

$('#homeWm').onclick=onLogoTap;$('#wordmark').onclick=onLogoTap;$('#onbTop').onclick=onLogoTap;

$('#creatorActivateBtn').onclick=()=>{
  const v=$('#creatorCode').value.trim();
  if(v===CFG.creator){isCreator=true;try{localStorage.setItem('sixwhy_creator_active','1');}catch(e){}$('#creatorOverlay').classList.remove('show');renderProf();toast(t('creatorOk'));}

$('#creatorSkip').onclick=()=>$('#creatorOverlay').classList.remove('show');

/* диалог */
$('#homeBtn').onclick=()=>go('scr-home');
let guideShown=false;
function resetDialog(showGuide){
  phase='start';session={start:null,whys:[],action:null};
  $('#thread').innerHTML='';$('#thread').style.display='none';$('#hintEmpty').style.display='';
  setProgress(0,lang==='ru'?'начни писать':'start writing');
  $('#capsuleBtn').textContent=t('saveCap');$('#capsuleBtn').disabled=false;
  if(showGuide&&!guideShown){guideShown=true;addGuide();}
}
function addGuide(){
  const e=document.createElement('div');e.className='entry guide';
  e.innerHTML='<div class="gt">'+t('guideTitle')+'</div><div class="gb">'+t('guideBody')+'</div>';
  $('#thread').appendChild(e);
}
function addUser(text,first){
  $('#thread').style.display='block';$('#hintEmpty').style.display='none';
  const e=document.createElement('div');e.className='entry'+(first?' first':'');
  e.innerHTML='<div class="who">'+(first?(lang==='ru'?'С этого началось':'It started with'):(lang==='ru'?'Твой ответ':'Your answer'))+'</div><div class="txt">'+esc(text)+'</div>';
  $('#thread').appendChild(e);scrollDown();
}
function thinking(cb){const e=document.createElement('div');e.className='thinking';e.innerHTML='<i></i><i></i><i></i>';$('#thread').appendChild(e);scrollDown();setTimeout(()=>{e.remove();cb();},950);}
function askWhy(n){const e=document.createElement('div');e.className='entry prompt';e.innerHTML='<div class="q">'+(lang==='ru'?'Почему?':'Why?')+'</div><div class="num">'+(lang==='ru'?'вопрос ':'question ')+n+' / 6</div>';$('#thread').appendChild(e);scrollDown();setProgress(n,lang==='ru'?'отвечай честно':'answer honestly');$('#msgInput').placeholder=lang==='ru'?'Потому что…':'Because…';$('#msgInput').focus();}
function askSmart(a){const q=findSmartQuestion(a);const e=document.createElement('div');e.className='entry prompt smart';e.innerHTML='<div class="q">'+q+'</div><div class="num">'+(lang==='ru'?'вопрос 3 из 6':'question 3 of 6')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(3,lang==='ru'?'честный ответ':'honest answer');$('#msgInput').placeholder=lang==='ru'?'Подумай…':'Think…';$('#msgInput').focus();}
function askAction(){const e=document.createElement('div');e.className='entry prompt act';e.innerHTML='<div class="q">'+(lang==='ru'?'Что я сейчас могу с этим сделать?':'What can I do about it now?')+'</div><div class="num">'+(lang==='ru'?'седьмой вопрос':'seventh question')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(6,lang==='ru'?'шаг':'step');$('#msgInput').placeholder=lang==='ru'?'Даже маленький шаг — уже шаг…':'Even a small step is a step…';$('#msgInput').focus();}
function setProgress(n,cap){$$('.pdot').forEach((d,i)=>d.classList.toggle('on',i<n));$('#pcap').textContent=cap;}
function useSmart(){return mode==='empathy'||mode==='draw';}
function submit(){
  const inp=$('#msgInput'),v=inp.value.trim();if(!v){inp.style.borderColor='#8F5A4A';setTimeout(()=>inp.style.borderColor='',600);return;}inp.value='';
  if(phase==='start'){session={start:v,whys:[],action:null};addUser(v,true);phase='whys';thinking(()=>askWhy(1));}
  else if(phase==='whys'){session.whys.push(v);addUser(v,false);if(session.whys.length===2&&useSmart())thinking(()=>askSmart(v));else if(session.whys.length<6)thinking(()=>askWhy(session.whys.length+1));else{phase='action';thinking(()=>askAction());}}
  else if(phase==='action'){session.action=v;addUser(v,false);finish();}
}
$('#sendBtn').onclick=submit;
$('#msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});

function finish(){
  const d=new Date();
  const done={date:d.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'long'})+', '+d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US',{hour:'2-digit',minute:'2-digit'}),start:session.start,root:session.whys[session.whys.length-1],action:session.action,capsule:false};
  if(mode==='capsule')done.capsule=true;
  history.push(done);saveHist();markChallengeDay();
  $('#rootText').textContent='«'+done.root+'»';$('#stepText').textContent=done.action;
  if(mode==='mirror'){const all=session.start+' '+session.whys.join(' ')+' '+session.action;$('#mirrorText').textContent=findMirrorResponse(all);$('#mirrorBlock').style.display='block';}else $('#mirrorBlock').style.display='none';
  buildMoodRowDone();
  const dc=$('#scr-done .done-check svg'),cl=dc.cloneNode(true);dc.parentNode.replaceChild(cl,dc);
  setTimeout(()=>{go('scr-done');if(mode==='capsule')toast(t('capSaved'));},600);
}
function markChallengeDay(){const k=todayKey();if(!challenge.days.includes(k)){challenge.days.push(k);saveChallenge();}}
function buildMoodRowDone(){
  $('#moodRowDone').innerHTML=MOOD_COLORS.map((c,i)=>'<div class="mood-opt" data-mi="'+i+'" style="background:'+c+'"><span>'+t('moods')[i]+'</span></div>').join('');
  const today=moods[todayKey()];if(today&&$('#moodRowDone').children[today.mood])$('#moodRowDone').children[today.mood].classList.add('sel');
  $$('#moodRowDone .mood-opt').forEach(o=>{o.onclick=()=>{$$('#moodRowDone .mood-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');moods[todayKey()]={mood:+o.dataset.mi,note:(moods[todayKey()]&&moods[todayKey()].note)||''};saveMoods();toast(t('moodSaved'));};});
}
$('#capsuleBtn').onclick=()=>{if(history.length>0){history[history.length-1].capsule=true;saveHist();toast(t('capSaved'));$('#capsuleBtn').textContent=t('saved');$('#capsuleBtn').disabled=true;}};
$('#againBtn').onclick=()=>{resetDialog(false);go('scr-main');setTimeout(()=>$('#msgInput').focus(),450);};
$('#toHomeBtn').onclick=()=>{renderChallenge();go('scr-home');};

/* история */
$('#backBtn').onclick=()=>go('scr-home');
function renderHist(){
  const L=$('#histList');
  if(!history.length){L.innerHTML='<div class="hempty">'+(lang==='ru'?'Пока пусто':'Empty for now')+'</div>';return;}
  let html=history.slice().reverse().map(s=>'<div class="hcard'+(s.capsule?' capsule':'')+'"><div class="hdate">'+esc(s.date)+(s.capsule?'<span class="cap-tag">🌱 '+(lang==='ru'?'КАПСУЛА':'CAPSULE')+'</span>':'')+'</div><div class="hrow"><span>'+(lang==='ru'?'Началось с':'Started with')+'</span><p>'+esc(s.start)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Корень':'Root')+'</span><p>'+esc(s.root)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Шаг':'Step')+'</span><p style="color:#5F7A5C;font-weight:700">'+esc(s.action)+'</p></div></div>').join('');
  html+='<button class="clear-link" id="clearHist">'+(lang==='ru'?'Очистить историю':'Clear history')+'</button>';L.innerHTML=html;
  $('#clearHist').onclick=()=>{history=[];saveHist();renderHist();toast(t('histCleared'));};
}

/* календарь */
let calYear=null,calMonth=null,editingDate=null;
const WD_RU=['пн','вт','ср','чт','пт','сб','вс'],WD_EN=['mo','tu','we','th','fr','sa','su'];
const MON_RU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCalendar(){
  const now=new Date();if(calYear==null){calYear=now.getFullYear();calMonth=now.getMonth();}
  $('#calWeekdays').innerHTML=(lang==='ru'?WD_RU:WD_EN).map(w=>'<span>'+w+'</span>').join('');
  $('#calMonth').textContent=(lang==='ru'?MON_RU:MON_EN)[calMonth]+' '+calYear;
  const first=new Date(calYear,calMonth,1);let startDay=(first.getDay()+6)%7;
  const days=new Date(calYear,calMonth+1,0).getDate();
  let cells='';for(let i=0;i<startDay;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){const key=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),m=moods[key],isToday=key===todayKey();cells+='<div class="cal-cell'+(isToday?' today':'')+(m?' filled':'')+'" data-date="'+key+'">'+d+(m?'<div class="cdot-mini" style="background:'+MOOD_COLORS[m.mood]+'"></div>':'')+'</div>';}
  $('#calGrid').innerHTML=cells;$$('#calGrid .cal-cell[data-date]').forEach(c=>{c.onclick=()=>openMoodSheet(c.dataset.date);});
  renderLegend();renderSummary();
}
function renderLegend(){$('#calLegend').innerHTML=t('moods').map((m,i)=>'<div class="lg"><i style="background:'+MOOD_COLORS[i]+'"></i>'+m+'</div>').join('');}
function renderSummary(){
  const prefix=calYear+'-'+String(calMonth+1).padStart(2,'0'),counts={};let total=0;
  Object.keys(moods).forEach(k=>{if(k.startsWith(prefix)){counts[moods[k].mood]=(counts[moods[k].mood]||0)+1;total++;}});
  if(total===0){$('#calSummary').innerHTML=lang==='ru'?'В этом месяце пока нет отметок.':'No marks this month yet.';return;}
  let best=0;Object.keys(counts).forEach(k=>{if(counts[k]>counts[best])best=k;});
  $('#calSummary').innerHTML=t('summary')(t('moods')[+best]);
}
$('#prevMonth').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();};
$('#nextMonth').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();};
$('#moodBackBtn').onclick=()=>{$('#moodSheet').classList.remove('show');go('scr-home');};
function openMoodSheet(date){
  editingDate=date;const parts=date.split('-');$('#msDate').textContent=+parts[2]+' '+(lang==='ru'?MON_RU:MON_EN)[+parts[1]-1];
  const cur=moods[date];$('#msMoods').innerHTML=t('moods').map((m,i)=>'<div class="ms-mood'+(cur&&cur.mood===i?' sel':'')+'" data-mi="'+i+'"><i style="background:'+MOOD_COLORS[i]+'"></i><span>'+m+'</span></div>').join('');
  $$('#msMoods .ms-mood').forEach(o=>{o.onclick=()=>{$$('#msMoods .ms-mood').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');};});
  $('#moodNote').value=(cur&&cur.note)||'';$('#moodSheet').classList.add('show');
}
$('#moodSaveBtn').onclick=()=>{const sel=$('#msMoods').querySelector('.ms-mood.sel');if(!sel){toast(t('writeFew'));return;}moods[editingDate]={mood:+sel.dataset.mi,note:$('#moodNote').value.trim()};saveMoods();$('#moodSheet').classList.remove('show');renderCalendar();toast(t('moodSaved'));};

/* что нового */
let wnIdx=0;
function checkWhatsNew(){
  let seen='';try{seen=localStorage.getItem('sixwhy_seen_version')||'';}catch(e){}
  if(seen!==APP_VERSION){buildWhatsNew();$('#wnOverlay').classList.add('show');$('#whatsnewBtn').classList.add('show');try{localStorage.setItem('sixwhy_seen_at',String(Date.now()));}catch(e){}}
  else{const at=parseInt(localStorage.getItem('sixwhy_seen_at')||'0',10);$('#whatsnewBtn').classList.toggle('show',Date.now()-at<2*24*3600*1000);}
}
function buildWhatsNew(){const data=t('wn');$('#wnSlides').innerHTML=data.map((s,i)=>'<div class="wn-slide'+(i===0?' active':'')+'"><div class="wi">'+s.i+'</div><div class="wt">'+s.t+'</div><div class="wd">'+s.d+'</div></div>').join('');$('#wnDots').innerHTML=data.map((_,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join('');wnIdx=0;}
function showWn(i){const sl=$$('#wnSlides .wn-slide'),dt=$$('#wnDots i');sl.forEach((s,k)=>s.classList.toggle('active',k===i));dt.forEach((d,k)=>d.classList.toggle('on',k===i));}
$('#wnNext').onclick=()=>{const n=t('wn').length;if(wnIdx<n-1){wnIdx++;showWn(wnIdx);}else closeWhatsNew();};
$('#wnPrev').onclick=()=>{if(wnIdx>0){wnIdx--;showWn(wnIdx);}};
$('#wnClose').onclick=closeWhatsNew;
function closeWhatsNew(){$('#wnOverlay').classList.remove('show');try{localStorage.setItem('sixwhy_seen_version',APP_VERSION);localStorage.setItem('sixwhy_seen_at',String(Date.now()));}catch(e){}}
$('#whatsnewBtn').onclick=()=>{buildWhatsNew();$('#wnOverlay').classList.add('show');};

applyI18N();buildOnb();buildReadBody();buildNoiseRow();
if(name&&onboarded){if(pin)go('scr-pin');else{initChallenge();enterApp();}}else{showOnb(0);go('scr-onb');}

setTimeout(()=>{if(onboarded&&!isCreator&&CFG.creator){$('#creatorOverlay').classList.add('show');}},1500);

if('serviceWorker' in navigator){
  const swCode=`const C='sixwhy-v11';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html','./manifest.webmanifest','./IMG_5479.jpeg','./config.json'])).then(()=>self.skipWaiting()));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.method==='GET'&&res.ok){const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));}return res;}).catch(()=>caches.match('./index.html'))));});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
