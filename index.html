<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SixWhy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="IMG_5479.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B312E;--mut:#6F7A72;--lilac:#7C9479;--lilac-deep:#5F7A5C;--lilac-soft:#DFE8DB;--lilac-line:#BCCBB6;--paper:#F2EFE8;--card:#FAF8F3;--line:#E2DCCE;--butter:#EAE0CC;--butter2:#F0E9DA;--butter-soft:#F4EEE1;--butter-line:#D6C9AC;--butter-ink:#6B5F45;--butter-mut:#8A7C5C;--serif:'Cormorant Garamond',serif;--sans:'Manrope',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:#E7E3D9}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;flex-direction:column;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
.scr.active{opacity:1;pointer-events:auto}
button{font-family:var(--sans)}
.wordmark{font-family:var(--serif);font-size:42px;font-weight:600;text-align:center;margin:20px 0 10px}
.wordmark em{font-style:italic;color:var(--lilac-deep)}
.auth-sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mut);text-align:center;margin-bottom:24px}
.field-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--card);outline:none}
input:focus,textarea:focus{border-color:var(--lilac)}
#pinInputReg,#pinInput{letter-spacing:8px;text-align:center;font-weight:800}
.field-hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.go-btn{width:100%;margin-top:14px;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer}
.go-btn.butter{background:var(--butter);color:var(--butter-ink)}
.go-btn.outline{background:transparent;color:var(--lilac-deep);border:1.5px solid var(--lilac-line)}
.priv-note{margin-top:20px;background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:13px;font-size:12.5px;line-height:1.5;color:var(--butter-ink)}
.disclaimer{margin-top:14px;font-size:11px;color:#a49e91;text-align:center}
.home-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.home-top .wm{font-family:var(--serif);font-size:23px;font-weight:600}
.home-top .wm em{font-style:italic;color:var(--lilac-deep)}
.ibtn{border:none;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9}
.greet{font-family:var(--serif);font-style:italic;font-size:24px;margin-bottom:14px}
.greet b{color:var(--lilac-deep)}
.challenge{background:var(--lilac-soft);border:1px solid var(--lilac-line);border-radius:16px;padding:14px;margin-bottom:14px}
.challenge .ch-t{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--lilac-deep);font-weight:600}
.challenge .ch-d{font-size:11px;color:var(--butter-mut);font-weight:800}
.ch-dots{display:flex;gap:6px;margin:10px 0}
.ch-dot{flex:1;height:7px;border-radius:100px;background:#fff;border:1px solid var(--lilac-line)}
.ch-dot.on{background:var(--lilac);border-color:var(--lilac)}
.challenge .ch-msg{font-size:12px;color:var(--mut);line-height:1.5}
.youalone{text-align:center;font-size:12px;color:var(--mut);margin-bottom:12px}
.youalone b{color:var(--lilac-deep)}
.quote-card{border-radius:16px;padding:16px;margin-bottom:10px}
.quote-card.lil{background:var(--lilac-soft);border:1px solid var(--lilac-line)}
.quote-card.but{background:var(--butter2);border:1px solid var(--butter-line)}
.qc-lbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:4px}
.quote-card.but .qc-lbl{color:var(--butter-mut)}
.qc-q{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4}
.qc-a{font-size:10px;font-weight:700;margin-top:4px;text-align:right;color:var(--mut)}
.tiles-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:15px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.tile .ti svg{width:24px;height:24px;fill:none;stroke:var(--lilac-deep);stroke-width:1.8}
.tile .tt{font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;margin-top:8px}
.tile .td{font-size:10px;color:var(--mut);margin-top:2px}
.tile.sel{border-color:var(--lilac);background:var(--lilac-soft)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.start-btn{width:100%;margin-top:16px;border:none;border-radius:16px;padding:17px;font-size:16px;font-weight:800;background:var(--lilac);color:#fff;cursor:pointer}
.home-foot{text-align:center;font-size:10px;color:#a49e91;margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.topbar .wm{font-family:var(--serif);font-size:21px;font-weight:600}
.topbar .wm em{font-style:italic;color:var(--lilac-deep)}
.inputbar{display:flex;gap:8px;padding:6px 0 10px}
#msgInput{flex:1;border:1.5px solid var(--line);border-radius:100px;padding:12px 18px;font-size:15px;background:var(--card)}
.send{width:44px;height:44px;border:none;border-radius:50%;background:var(--butter);display:grid;place-items:center;cursor:pointer}
.send svg{width:18px;height:18px;fill:none;stroke:var(--butter-ink);stroke-width:2.3}
.progress{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0}
.pdot{width:7px;height:7px;border-radius:50%;background:#DDD8CC}
.pdot.on{background:var(--lilac)}
.canvas{flex:1;overflow-y:auto;padding:10px 20px}
.hint-empty{text-align:center;padding:40px 20px}
.hint-empty .hd{font-family:var(--serif);font-style:italic;font-size:20px;color:#98a094;margin-bottom:8px}
.hint-empty p{font-size:13px;color:#a49e91;line-height:1.6}
.thread{border-left:1.5px solid var(--butter-line);padding:6px 0 10px 24px;margin-left:4px}
.entry{margin-bottom:20px;position:relative}
.entry::before{content:"";position:absolute;left:-29px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--butter-mut)}
.entry .who{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:4px}
.entry .txt{font-size:14px;line-height:1.5}
.entry.prompt .q{font-family:var(--serif);font-style:italic;font-weight:600;font-size:28px;color:var(--ink)}
.entry .num{font-size:10px;color:var(--lilac-line);margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
.thinking{display:flex;gap:5px;padding:10px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--butter-mut);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.4}50%{opacity:1}}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:24px}
.hcard{background:var(--card);border:1px solid var(--butter-line);border-radius:14px;padding:14px;margin-bottom:10px}
.hdate{font-size:10px;font-weight:800;color:var(--butter-mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
.hrow{margin-bottom:6px}
.hrow span{font-size:9px;font-weight:800;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:.1em}
.hrow p{font-size:13px;line-height:1.5;margin-top:2px}
.hempty{text-align:center;color:#a49e91;padding:40px 20px;font-size:14px}
.clear-link{display:block;margin:6px auto 0;border:none;background:none;color:#8F5A4A;font-size:12px;font-weight:700;cursor:pointer}
.prof-user{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prof-ava{width:52px;height:52px;border-radius:16px;background:var(--lilac);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:22px;color:#fff}
.prof-user .pn{font-size:16px;font-weight:700}
.prof-user .ps{font-size:11px;color:var(--mut)}
.p-card{background:var(--card);border:1.5px solid var(--butter-line);border-radius:16px;padding:16px;margin-bottom:12px}
.p-card h3{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--butter-mut);margin-bottom:10px}
.p-card .st-line{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.5}
.pin-row{display:flex;gap:6px}
.pin-row input{flex:1;letter-spacing:5px;text-align:center;font-weight:800}
.pin-row button{border:none;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer}
#setPinBtn{background:var(--lilac);color:#fff}
#removePinBtn{background:transparent;border:1.5px solid #d3bdb5 !important;color:#8F5A4A}
.lang-row{display:flex;gap:6px}
.lang-row button{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
.lang-row button.sel{border-color:var(--lilac);background:var(--lilac-soft);color:var(--lilac-deep)}
.help-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.help-item{background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:10px;padding:10px;text-decoration:none;color:var(--butter-ink);font-size:12px}
.help-item .hn{font-weight:800;display:block;margin-bottom:2px}
.help-item .hd{font-size:10px;color:var(--butter-mut)}
.creator-card{background:var(--lilac-soft);border:1.5px solid var(--lilac-line);border-radius:16px;padding:16px;margin-bottom:12px;display:none}
.creator-card.show{display:block}
.creator-card h3{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep);margin-bottom:8px}
.creator-card .big-num{font-family:var(--serif);font-size:36px;font-weight:600;color:var(--lilac-deep)}
.creator-card .big-lbl{font-size:10px;color:var(--mut);margin-bottom:10px}
.creator-card p{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:10px}
.stats-btn,.qr-btn,.capsule-btn{width:100%;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:6px}
.stats-btn{background:var(--lilac);color:#fff}
.qr-btn{background:var(--butter);color:var(--butter-ink)}
.capsule-btn{background:var(--lilac-soft);color:var(--lilac-deep);border:1.5px solid var(--lilac-line)}
.intro-btn{width:100%;margin-top:4px;border:none;border-radius:14px;padding:13px;background:var(--butter);font-size:13px;font-weight:800;color:var(--butter-ink);cursor:pointer}
.logout-btn{width:100%;margin-top:8px;border:1.5px solid #d3bdb5;border-radius:14px;padding:13px;background:transparent;font-size:13px;font-weight:700;color:#8F5A4A;cursor:pointer}
.prof-ver{text-align:center;color:var(--butter-mut);font-size:10px;margin-top:16px}
.done-check{margin-bottom:14px;text-align:center}
.done-check svg circle{stroke-dasharray:180;stroke-dashoffset:180;animation:dk .9s .2s forwards}
.done-check svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:dk .5s 1s forwards}
@keyframes dk{to{stroke-dashoffset:0}}
#scr-done h2{font-family:var(--serif);font-style:italic;font-size:26px;text-align:center;margin-bottom:4px}
#scr-done .sub{color:var(--mut);font-size:13px;text-align:center;margin-bottom:18px}
.root-block,.step-block{border-radius:16px;padding:16px;margin-bottom:12px}
.root-block{background:var(--card);border:1px solid var(--butter-line)}
.step-block{background:var(--butter2);border:1px solid var(--butter-line)}
.blk-lbl{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.step-block .blk-lbl{color:var(--butter-mut)}
.root-block .rt{font-family:var(--serif);font-style:italic;font-size:19px}
.step-block .rt{font-size:14px;font-weight:700;color:var(--butter-ink)}
.done-btns{display:flex;flex-direction:column;gap:8px}
.done-btns .go-btn{margin-top:0}
.done-disc{font-size:10px;color:#a49e91;margin-top:14px;line-height:1.5;text-align:center}
.overlay{position:absolute;inset:0;background:#2a243566;opacity:0;pointer-events:none;transition:.3s;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay.show{opacity:1;pointer-events:auto}
.wn-panel{width:100%;max-width:480px;background:var(--paper);border-radius:20px 20px 0 0;padding:max(20px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
.wn-slides{position:relative;min-height:200px}
.wn-slide{position:absolute;inset:0;opacity:0;transition:.4s;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.wn-slide.active{opacity:1}
.wn-slide .wi{font-size:40px}
.wn-slide .wt{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:600}
.wn-slide .wd{font-size:13px;color:var(--mut);line-height:1.5;max-width:280px}
.wn-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.wn-arrow{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--lilac-line);background:var(--card);color:var(--lilac-deep);font-size:20px;cursor:pointer}
.wn-dots{display:flex;gap:6px}
.wn-dots i{width:6px;height:6px;border-radius:50%;background:#DDD8CC}
.wn-dots i.on{background:var(--lilac);width:16px;border-radius:100px}
.wn-close{width:100%;border:none;border-radius:14px;padding:14px;background:var(--lilac);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.menu-btn{width:100%;border:none;border-radius:12px;padding:13px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;text-align:left}
.menu-about{font-size:12px;color:var(--mut);max-height:0;overflow:hidden;transition:max-height .4s}
.menu-about.open{max-height:180px;padding:4px 2px 8px}
.inst-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.inst-step .n{width:24px;height:24px;border-radius:50%;background:var(--lilac);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.inst-step .s{font-size:13px;line-height:1.5}
.egg-panel{text-align:center}
.egg-panel .ei{font-size:48px;margin-bottom:6px}
.egg-panel .et{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:600;margin-bottom:8px}
.egg-panel .em{font-size:13px;color:var(--mut);line-height:1.5;margin-bottom:14px}
.toast{position:absolute;bottom:22px;left:50%;transform:translate(-50%,14px);background:#2B312E;color:#fff;font-size:12px;font-weight:600;padding:10px 18px;border-radius:100px;opacity:0;transition:.3s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="app">
  <section class="scr active" id="scr-onb">
    <div class="wordmark" id="onbTop">Six<em>Why</em></div>
    <div id="onbSlides" style="flex:1;position:relative"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div id="onbDots" style="display:flex;gap:6px"></div>
      <button class="go-btn butter" id="onbBtn" style="margin-top:0">Далее →</button>
    </div>
  </section>
  <section class="scr" id="scr-auth">
    <div class="wordmark" id="wordmark">Six<em>Why</em></div>
    <div class="auth-sub" data-i18n="authSub"></div>
    <div class="field-lbl" data-i18n="nameLbl"></div>
    <input type="text" id="nameInput" placeholder="Имя или ник" maxlength="24">
    <div class="field-lbl" data-i18n="phoneLbl"></div>
    <input type="tel" id="phoneInput" placeholder="+7 ___ ___ __ __">
    <div class="field-hint" data-i18n="phoneHint"></div>
    <div class="field-lbl" data-i18n="pinLbl"></div>
    <input type="password" id="pinInputReg" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="field-hint" data-i18n="pinHint"></div>
    <button class="go-btn" id="enterBtn" data-i18n="continue"></button>
    <button class="go-btn outline" id="restoreBtn" style="margin-top:8px" data-i18n="restore"></button>
    <div class="priv-note"><span data-i18n="privNote"></span></div>
    <div class="disclaimer" data-i18n="disclaimer"></div>
  </section>
  <section class="scr" id="scr-pin" style="justify-content:center;align-items:center;text-align:center">
    <div style="font-size:40px;margin-bottom:12px">🔐</div>
    <h2 style="font-family:var(--serif);font-style:italic;font-size:24px;margin-bottom:6px" data-i18n="enterPin"></h2>
    <div style="font-size:12px;color:var(--mut);margin-bottom:20px" data-i18n="pinSpace"></div>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••" style="max-width:180px;text-align:center;letter-spacing:10px;font-size:18px;font-weight:800">
    <button class="go-btn" id="pinBtn" style="max-width:180px;margin-top:14px" data-i18n="open"></button>
    <button class="go-btn outline" id="forgotBtn" style="max-width:180px;margin-top:6px" data-i18n="forgot"></button>
  </section>
  <section class="scr" id="scr-home">
    <div class="home-top">
      <div class="wm" id="homeWm">Six<em>Why</em></div>
      <div style="display:flex;gap:2px">
        <button class="ibtn" id="menuBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="greet" id="greet"></div>
    <div class="challenge">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="ch-t" data-i18n="chTitle"></div>
        <div class="ch-d" id="chDay"></div>
      </div>
      <div class="ch-dots" id="chDots"></div>
      <div class="ch-msg" id="chMsg"></div>
    </div>
    <div class="youalone" id="youAlone"></div>
    <div class="quote-card lil">
      <div class="qc-lbl" data-i18n="quoteDay"></div>
      <div class="qc-q" id="quoteText"></div>
      <div class="qc-a" id="quoteAuthor"></div>
    </div>
    <div class="quote-card but">
      <div class="qc-lbl" data-i18n="creatorWord"></div>
      <div class="qc-q" id="quote2Text"></div>
      <div class="qc-a" id="quote2Author"></div>
    </div>
    <div class="tiles-lbl" data-i18n="chooseToday"></div>
    <div class="tiles">
      <div class="tile sel" data-mode="empathy"><div class="ti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-9-9C1.5 8 3.5 5 6.5 5c2 0 3.5 1 4.5 2.5L12 9l1-1.5C14 6 15.5 5 17.5 5c3 0 5 3 3.5 6-2 4.5-9 9-9 9z"/></svg></div><div class="tt" data-i18n="empathy"></div><div class="td" data-i18n="empathyD"></div></div>

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function normPhone(p){return(p||'').replace(/\D/g,'');}
function buildOnb(){const data=t('onb');$('#onbSlides').innerHTML=data.map((s,i)=>'<div class="wn-slide'+(i===0?' active':'')+'"><div class="st" style="font-family:var(--serif);font-style:italic;font-size:20px;font-weight:500;line-height:1.45;color:var(--ink);max-width:300px">'+s.st+'</div><div style="background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px 16px;font-size:13px;line-height:1.5;color:var(--butter-ink);max-width:280px">'+s.bf+'</div></div>').join('');$('#onbDots').innerHTML=data.map((_,i)=>'<span class="odot'+(i===0?' on':'')+'" style="width:7px;height:7px;border-radius:50%;background:'+(i===0?'var(--butter-mut)':'#DDD8CC')+';transition:.35s"></span>').join('');}
let onbIdx=0;
function showOnb(i){const slides=$$('#onbSlides .wn-slide'),dots=$$('#onbDots .odot');slides.forEach((s,k)=>s.classList.toggle('active',k===i));dots.forEach((d,k)=>{d.style.background=k===i?'var(--butter-mut)':'#DDD8CC';d.style.width=k===i?'16px':'7px';d.style.borderRadius=k===i?'100px':'50%';});}
$('#onbBtn').onclick=()=>{const n=$$('#onbSlides .wn-slide').length;if(onbIdx<n-1){onbIdx++;showOnb(onbIdx);}else{go('scr-auth');setTimeout(()=>$('#nameInput').focus(),400);}};
function register(){const nm=$('#nameInput').value.trim(),ph=normPhone($('#phoneInput').value),pw=$('#pinInputReg').value.trim();if(!nm){$('#nameInput').style.borderColor='#8F5A4A';setTimeout(()=>$('#nameInput').style.borderColor='',600);$('#nameInput').focus();return;}if(ph.length<10){toast(t('phoneNeeded'));$('#phoneInput').focus();return;}if(!/^\d{4}$/.test(pw)){toast(t('pinDigits'));$('#pinInputReg').focus();return;}name=nm;phone=ph;pin=pw;try{localStorage.setItem('sixwhy_name',name);localStorage.setItem('sixwhy_phone',phone);localStorage.setItem('sixwhy_pin',pin);localStorage.setItem('sixwhy_onb','1');}catch(e){}onboarded=true;initChallenge();enterApp();toast(t('welcome')(name));}
$('#enterBtn').onclick=register;
$('#nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#phoneInput').focus();});
$('#phoneInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pinInputReg').focus();});
$('#pinInputReg').addEventListener('keydown',e=>{if(e.key==='Enter')register();});
$('#restoreBtn').onclick=()=>$('#importFile').click();
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);restoreBackup(d);toast(t('backupRestored'));go('scr-auth');}catch(err){toast(t('backupBad'));}};r.readAsText(f);e.target.value='';});
$('#pinBtn').onclick=tryPin;$('#pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin();});
function tryPin(){const v=$('#pinInput').value;if(v===pin){$('#pinInput').value='';enterApp();}else{toast(t('wrongPin'));$('#pinInput').value='';$('#pinInput').focus();}}
$('#forgotBtn').onclick=()=>{if(confirm(t('backupConfirm'))){$('#importFile').click();}else{toast(lang==='ru'?'Восстанови из копии':'Restore from backup');}};
function initChallenge(){if(!challenge.start){challenge={start:todayKey(),days:[]};saveChallenge();}}
function enterApp(){$('#greet').innerHTML=t('greet')(esc(name||'?'));renderHome();renderChallenge();renderYouAlone();checkWhatsNew();go('scr-home');}
function renderChallenge(){const d=challenge.days.length;$('#chDay').textContent=t('dayOf')(d+(challenge.days.includes(todayKey())?0:1));$('#chDots').innerHTML=Array.from({length:7}).map((_,i)=>'<div class="ch-dot'+(i<d?' on':'')+'"></div>').join('');$('#chMsg').textContent=t('chMsg')(d);}
function renderYouAlone(){$('#youAlone').innerHTML=t('youAlone')(getVisitCount());}
function renderHome(){$$('.tile').forEach(tl=>tl.classList.toggle('sel',tl.dataset.mode===mode));$('#startBtn').textContent=(mode==='draw')?t('startDraw'):(mode==='day')?t('startDay'):t('startTalk');}
$$('.tile').forEach(tl=>{tl.onclick=()=>{mode=tl.dataset.mode;try{localStorage.setItem('sixwhy_mode',mode);}catch(e){}renderHome();};});
$('#startBtn').onclick=()=>{if(mode==='draw'||mode==='day'){toast(lang==='ru'?'Скоро появится':'Coming soon');}else{resetDialog(true);go('scr-main');setTimeout(()=>$('#msgInput').focus(),400);}};
$('#menuBtn').onclick=()=>{$('#menuAboutBody').textContent='';$('#menuAboutBody').classList.remove('open');$('#menuOverlay').classList.add('show');};
$('#menuClose').onclick=()=>$('#menuOverlay').classList.remove('show');
$('#menuHist').onclick=()=>{$('#menuOverlay').classList.remove('show');renderHist();go('scr-hist');};
$('#menuProf').onclick=()=>{$('#menuOverlay').classList.remove('show');renderProf();go('scr-prof');};
$('#menuInstall').onclick=()=>{$('#menuOverlay').classList.remove('show');showInstall();};
$('#menuAbout').onclick=()=>{$('#menuAboutBody').textContent=t('aboutBody');$('#menuAboutBody').classList.toggle('open');};
$('#homeBtn').onclick=()=>go('scr-home');
let guideShown=false;
function resetDialog(showGuide){phase='start';session={start:null,whys:[],action:null};$('#thread').innerHTML='';$('#thread').style.display='none';$('#hintEmpty').style.display='';setProgress(0,lang==='ru'?'начни':'start');$('#capsuleBtn').textContent=t('saveCap');$('#capsuleBtn').disabled=false;if(showGuide&&!guideShown){guideShown=true;addGuide();}}
function addGuide(){const e=document.createElement('div');e.className='entry';e.style.cssText='background:var(--butter-soft);border:1px solid var(--butter-line);border-radius:14px;padding:12px 14px;margin-left:0;margin-bottom:22px';e.innerHTML='<div style="font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--butter-mut);margin-bottom:6px">'+(lang==='ru'?'Как отвечать на «почему»':'How to answer "why"')+'</div><div style="font-size:13px;line-height:1.55;color:var(--butter-ink)">'+(lang==='ru'?'Отвечай изнутри — про чувства.<br><br>Не: «скучно, потому что дождь»<br>А: «дождь значит неспокойствие»<br>И дальше: «не нравится его звук»<br><br>Так дойдёшь до корня.':'Answer from inside — feelings, not facts.<br><br>Not: "bored because rain"<br>But: "rain means unease"<br>Then: "I dislike its sound"')+'</div>';$('#thread').appendChild(e);}
function addUser(text,first){$('#thread').style.display='block';$('#hintEmpty').style.display='none';const e=document.createElement('div');e.className='entry';e.innerHTML='<div class="who">'+(first?(lang==='ru'?'Начало':'Start'):(lang==='ru'?'Ответ':'Answer'))+'</div><div class="txt">'+esc(text)+'</div>';$('#thread').appendChild(e);scrollDown();}
function thinking(cb){const e=document.createElement('div');e.className='thinking';e.innerHTML='<i></i><i></i><i></i>';$('#thread').appendChild(e);scrollDown();setTimeout(()=>{e.remove();cb();},900);}
function askWhy(n){const e=document.createElement('div');e.className='entry prompt';e.innerHTML='<div class="q">'+(lang==='ru'?'Почему?':'Why?')+'</div><div class="num">'+(lang==='ru'?'вопрос ':'q ')+n+'/6</div>';$('#thread').appendChild(e);scrollDown();setProgress(n,lang==='ru'?'честно':'honest');$('#msgInput').placeholder=lang==='ru'?'Потому что…':'Because…';$('#msgInput').focus();}
function askSmart(a){const q=findSmartQuestion(a);const e=document.createElement('div');e.className='entry prompt';e.innerHTML='<div class="q" style="font-size:22px">'+q+'</div><div class="num">'+(lang==='ru'?'вопрос 3/6':'q 3/6')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(3,lang==='ru'?'честно':'honest');$('#msgInput').placeholder=lang==='ru'?'Подумай…':'Think…';$('#msgInput').focus();}
function askAction(){const e=document.createElement('div');e.className='entry prompt';e.innerHTML='<div class="q" style="color:var(--butter-mut);font-size:24px">'+(lang==='ru'?'Что сделать?':'What to do?')+'</div><div class="num">'+(lang==='ru'?'7-й вопрос':'7th q')+'</div>';$('#thread').appendChild(e);scrollDown();setProgress(6,lang==='ru'?'шаг':'step');$('#msgInput').placeholder=lang==='ru'?'Маленький шаг…':'Small step…';$('#msgInput').focus();}
function setProgress(n,cap){$$('.pdot').forEach((d,i)=>d.classList.toggle('on',i<n));$('#pcap').textContent=cap;}
function useSmart(){return mode==='empathy';}
function submit(){const inp=$('#msgInput'),v=inp.value.trim();if(!v){inp.style.borderColor='#8F5A4A';setTimeout(()=>inp.style.borderColor='',600);return;}inp.value='';if(phase==='start'){session={start:v,whys:[],action:null};addUser(v,true);phase='whys';thinking(()=>askWhy(1));}else if(phase==='whys'){session.whys.push(v);addUser(v,false);if(session.whys.length===2&&useSmart())thinking(()=>askSmart(v));else if(session.whys.length<6)thinking(()=>askWhy(session.whys.length+1));else{phase='action';thinking(()=>askAction());}}else if(phase==='action'){session.action=v;addUser(v,false);finish();}}
$('#sendBtn').onclick=submit;$('#msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
function finish(){const d=new Date();const done={date:d.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'long'})+', '+d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US',{hour:'2-digit',minute:'2-digit'}),start:session.start,root:session.whys[session.whys.length-1],action:session.action,capsule:false};if(mode==='capsule')done.capsule=true;history.push(done);saveHist();markChallengeDay();$('#rootText').textContent='«'+done.root+'»';$('#stepText').textContent=done.action;if(mode==='mirror'){const all=session.start+' '+session.whys.join(' ')+' '+session.action;$('#stepText').textContent=findMirrorResponse(all);}const dc=$('#scr-done .done-check svg'),cl=dc.cloneNode(true);dc.parentNode.replaceChild(cl,dc);setTimeout(()=>{go('scr-done');if(mode==='capsule')toast(t('capSaved'));},600);}
function markChallengeDay(){const k=todayKey();if(!challenge.days.includes(k)){challenge.days.push(k);saveChallenge();}}
$('#capsuleBtn').onclick=()=>{if(history.length>0){history[history.length-1].capsule=true;saveHist();toast(t('capSaved'));$('#capsuleBtn').textContent=t('saved');$('#capsuleBtn').disabled=true;}};$('#againBtn').onclick=()=>{resetDialog(false);go('scr-main');setTimeout(()=>$('#msgInput').focus(),400);};$('#toHomeBtn').onclick=()=>{renderChallenge();go('scr-home');};
$('#backBtn').onclick=()=>go('scr-home');
function renderHist(){const L=$('#histList');if(!history.length){L.innerHTML='<div class="hempty">'+(lang==='ru'?'Пусто':'Empty')+'</div>';return;}let html=history.slice().reverse().map(s=>'<div class="hcard'+(s.capsule?' capsule':'')+'"><div class="hdate">'+esc(s.date)+(s.capsule?'<span style="color:var(--butter-ink);font-size:9px">🌱</span>':'')+'</div><div class="hrow"><span>'+(lang==='ru'?'Начало':'Start')+'</span><p>'+esc(s.start)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Корень':'Root')+'</span><p>'+esc(s.root)+'</p></div><div class="hrow"><span>'+(lang==='ru'?'Шаг':'Step')+'</span><p style="color:#5F7A5C;font-weight:700">'+esc(s.action)+'</p></div></div>').join('');html+='<button class="clear-link" id="clearHist">'+(lang==='ru'?'Очистить':'Clear')+'</button>';L.innerHTML=html;$('#clearHist').onclick=()=>{history=[];saveHist();renderHist();toast(t('histCleared'));};}
function renderProf(){$('#profName').textContent=name||'?';$('#profPhone').textContent=phone?(lang==='ru'?'+':'+')+phone:'—';$('#profAva').textContent=(name||'?').trim().charAt(0).toUpperCase();const hasPin=!!pin;$('#pinStatus').textContent=hasPin?(lang==='ru'?'Пароль установлен':'Set'):(lang==='ru'?'Нет':'None');$('#removePinBtn').style.display=hasPin?'block':'none';$('#setPinBtn').textContent=hasPin?t('change'):t('create');$$('.lang-row button').forEach(b=>b.classList.toggle('sel',b.dataset.lang===lang));$('#creatorCard').classList.toggle('show',!!isCreator);if(isCreator)$('#creatorCount').textContent=getVisitCount();$('#helpList').innerHTML=HELP_LINES.map(h=>'<a class="help-item" href="tel:'+h.d.replace(/[^+0-9]/g,'')+'"><span class="hn">'+h.n+'</span><span class="hd">'+h.d+'</span></a>').join('');}
$('#profBackBtn').onclick=()=>go('scr-home');$('#setPinBtn').onclick=()=>{const v=$('#pinInputProf').value.trim();if(!/^\d{4}$/.test(v)){toast(t('pinDigits'));return;}pin=v;try{localStorage.setItem('sixwhy_pin',pin);}catch(e){}$('#pinInputProf').value='';renderProf();toast(t('pinSet'));};$('#removePinBtn').onclick=()=>{pin='';try{localStorage.removeItem('sixwhy_pin');}catch(e){}renderProf();toast(t('pinRemoved'));};$$('.lang-row button').forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('sixwhy_lang',lang);}catch(e){}applyI18N();buildOnb();showOnb(onbIdx);renderHome();renderChallenge();renderYouAlone();renderProf();toast(lang==='ru'?'Русский':'English');};});$('#statsBtn').onclick=()=>window.open('https://github.com/singdarrad-oss/-SixWhy/graphs/traffic','_blank');$('#introBtn').onclick=()=>{onbIdx=0;showOnb(0);go('scr-onb');};$('#logoutBtn').onclick=()=>{try{['sixwhy_name','sixwhy_phone','sixwhy_onb','sixwhy_mode','sixwhy_pin','sixwhy_lang'].forEach(k=>localStorage.removeItem(k));}catch(e){}name='';phone='';onboarded=false;mode='empathy';pin='';onbIdx=0;buildOnb();showOnb(0);go('scr-onb');toast(t('bye'));};
function buildBackup(){return{v:APP_VERSION,name,phone,pin,history,challenge,creatorActive:isCreator?'1':'0',exportedAt:new Date().toISOString()};}
function restoreBackup(d){if(d.name){name=d.name;try{localStorage.setItem('sixwhy_name',name);}catch(e){}}if(d.phone){phone=d.phone;try{localStorage.setItem('sixwhy_phone',phone);}catch(e){}}if(d.pin){pin=d.pin;try{localStorage.setItem('sixwhy_pin',pin);}catch(e){}}if(d.history){history=d.history;saveHist();}if(d.challenge){challenge=d.challenge;saveChallenge();}if(d.creatorActive==='1'){isCreator=true;try{localStorage.setItem('sixwhy_creator_active','1');}catch(e){}}}
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(buildBackup(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sixwhy-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url);toast(t('backupDone'));};$('#importBtn').onclick=()=>$('#importFile').click();
let logoTaps=0,logoTimer=null;
function egg(){$('#eggI').textContent='🌿';$('#eggT').textContent=t('egg').t;$('#eggM').textContent=t('egg').m;$('#eggOverlay').classList.add('show');}
$('#eggClose').onclick=()=>$('#eggOverlay').classList.remove('show');
function onLogoTap(){logoTaps++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>{logoTaps=0;},1800);if(logoTaps>=7){logoTaps=0;egg();}}
$('#homeWm').onclick=onLogoTap;$('#wordmark').onclick=onLogoTap;$('#onbTop').onclick=onLogoTap;
$('#creatorActivateBtn').onclick=()=>{const v=$('#creatorCode').value.trim();if(v===CFG.creator){isCreator=true;try{localStorage.setItem('sixwhy_creator_active','1');}catch(e){}$('#creatorOverlay').classList.remove('show');renderProf();toast(t('creatorOk'));}else{toast(t('creatorWrong'));}};$('#creatorSkip').onclick=()=>$('#creatorOverlay').classList.remove('show');
function showInstall(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const steps=ios?t('instIOS'):t('instAnd');$('#instSteps').innerHTML=steps.map((s,i)=>'<div class="inst-step"><div class="n">'+(i+1)+'</div><div class="s">'+s+'</div></div>').join('');$('#instOverlay').classList.add('show');}
$('#instClose').onclick=()=>$('#instOverlay').classList.remove('show');$('#instOverlay').addEventListener('click',e=>{if(e.target.id==='instOverlay')$('#instOverlay').classList.remove('show');});
let wnIdx=0;
function checkWhatsNew(){let seen='';try{seen=localStorage.getItem('sixwhy_seen_version')||'';}catch(e){}if(seen!==APP_VERSION){buildWhatsNew();}else{}}
function buildWhatsNew(){$('#wnSlides').innerHTML='';$('#wnDots').innerHTML='';wnIdx=0;}
function showWn(i){}
$('#wnNext').onclick=()=>closeWhatsNew();$('#wnPrev').onclick=()=>{};$('#wnClose').onclick=closeWhatsNew;
function closeWhatsNew(){$('#wnOverlay').classList.remove('show');try{localStorage.setItem('sixwhy_seen_version',APP_VERSION);localStorage.setItem('sixwhy_seen_at',String(Date.now()));}catch(e){}}
applyI18N();buildOnb();
if(name&&onboarded){if(pin)go('scr-pin');else{initChallenge();enterApp();}}else{showOnb(0);go('scr-onb');}
setTimeout(()=>{if(onboarded&&!isCreator&&CFG.creator){$('#creatorOverlay').classList.add('show');}},1500);
</script>
</body>
</html>
